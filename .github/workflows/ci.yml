name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Un tag d'image peut disparaître sans aucun commit : contrôle hebdomadaire (lundi 6 h UTC)
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Moindre privilège : lecture seule par défaut, écriture du registre pour le seul job image
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions épinglées par commit : un tag peut être déplacé, pas un hash
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # `node --test` sans argument : avec `tests/`, Node >= 24 échoue « Cannot find module »
      - name: Tests des règles (node --test)
        run: node --test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Docker exige un nom d'image en minuscules (le compte GitHub contient des majuscules)
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Le conteneur démarre, nginx accepte la conf et sert la page, les assets et /healthz
      - name: Smoke test
        run: |
          docker run -d --name game -p 8080:8080 $IMAGE:${{ github.sha }}
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          for path in /healthz / /style.css /main.js /logic.js /favicon.svg; do
            curl -fsS -o /dev/null http://127.0.0.1:8080$path || { echo "KO $path"; docker logs game; exit 1; }
            echo "OK $path"
          done
          curl -fsSI http://127.0.0.1:8080/ | grep -qi '^content-security-policy:' || { echo "CSP absente"; exit 1; }
          docker rm -f game
      # Scan Trivy bloquant sur CRITICAL : binaire téléchargé (l'action trivy-action échoue aléatoirement au téléchargement)
      - name: Scan Trivy (bloquant sur CRITICAL)
        run: |
          curl --retry 5 --retry-all-errors -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.70.0/trivy_0.70.0_Linux-64bit.tar.gz | tar xz -C /usr/local/bin trivy
          trivy image --severity CRITICAL --exit-code 1 --ignore-unfixed $IMAGE:${{ github.sha }}
      - name: Push sur GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
